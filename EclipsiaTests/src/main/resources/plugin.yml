name: EclipsiaTests
version: '${project.version}'
main: ru.eclipsia.tests.EclipsiaTests
api-version: '1.20'
author: EclipsiaTeam
description: Плагин для автоматизированного тестирования систем Eclipsia
depend: [EclipsiaCore]
softdepend: [EclipsiaItems, EclipsiaMobs, EclipsiaPerks, EclipsiaSkills]

commands:
  test:
    description: Запустить тесты
    usage: /test [all|gui|stats|equipment|perks|mobs]
    permission: eclipsia.admin
  testresult:
    description: Показать результаты последних тестов
    usage: /testresult
    permission: eclipsia.admin
  autotest:
    description: Включить/выключить автоматическое тестирование
    usage: /autotest [on|off]
    permission: eclipsia.admin
  testperks:
    description: Выдать перки для тестов
    usage: /testperks <all|points <n>|reset>
    permission: eclipsia.admin
  testgems:
    description: Выдать skill/support gems для тестов
    usage: /testgems <all|skills|supports|<id>>
    permission: eclipsia.admin
  teststats:
    description: Тестовая выдача статов профиля
    usage: /teststats <max|addall <n>|set <key> <val>|reset|show>
    permission: eclipsia.admin

permissions:
  eclipsia.admin:
    description: Доступ к командам тестирования
    default: op
