name: EclipsiaSkills
version: 1.0.0
main: ru.eclipsia.skills.EclipsiaSkills
api-version: 1.20
depend: [EclipsiaCore, EclipsiaItems]
author: EclipsiaTeam

commands:
  skills:
    description: Открыть меню навыков
    usage: /skills
  giveskill:
    description: Выдать навык игроку (только для админов)
    usage: /giveskill <игрок> <тип>
    permission: eclipsia.admin
  giveall:
    description: Выдать по одному из всех навыков и поддержек (тест связей)
    usage: /giveall
    permission: eclipsia.admin
  givestarter:
    description: Выдать стартовый навык класса
    usage: /givestarter [warrior|archer|mage]
    permission: eclipsia.admin
