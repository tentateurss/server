# Конфигурация кастомных мобов
# version-marker: beach-roster-v2 (auto-overwrite trigger)

mobs:
  # ===========================================================================
  # СТАРТОВЫЕ МОБЫ БЕРЕГА (5 типов) — заменяют high-level мобов на пляже.
  # Темы: вода (Утопленник), песок (Песчаный ползун), лес у тропы (Гниющий
  # зомби), лес дальше (Скелет-страж), деревья (Щелкун).
  # ===========================================================================

  # 1) Утопленник — у кромки воды (z = -100..-90), starter L3.
  zombie_drowned:
    display-name: "§3Утопленник"
    entity-type: DROWNED
    level: 3
    health: 60
    damage: 6
    armor: 1
    experience: 30
    equipment:
      mainhand: STICK
    drops:
      orbs:
        min: 3
        max: 8
        chance: 80
    spawn-zones:
      - beach_coast_south

  # 2) Песчаный ползун — пляж и опушки леса, стайки.
  sand_crawler:
    display-name: "§8Песчаный ползун"
    entity-type: SILVERFISH
    level: 2
    health: 25
    damage: 4
    armor: 0
    experience: 15
    drops:
      orbs:
        min: 1
        max: 4
        chance: 70
    spawn-zones:
      - beach_coast_south
      - beach_forest_west
      - beach_forest_east

  # 3) Гниющий зомби — лес вдоль тропы, в ржавых железных доспехах.
  zombie_warrior:
    display-name: "§2Гниющий зомби"
    entity-type: ZOMBIE
    level: 5
    health: 100
    damage: 12
    armor: 4
    experience: 40
    equipment:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      mainhand: IRON_SWORD
    drops:
      orbs:
        min: 5
        max: 12
        chance: 90
    spawn-zones:
      - beach_forest_west
      - beach_forest_center
      - beach_forest_east

  # 4) Скелет-страж — лес дальше от тропы, для обучения уклонению.
  skeleton_archer:
    display-name: "§7Скелет-страж"
    entity-type: SKELETON
    level: 7
    health: 80
    damage: 16
    armor: 2
    experience: 50
    equipment:
      mainhand: BOW
      helmet: LEATHER_HELMET
      chestplate: LEATHER_CHESTPLATE
    drops:
      orbs:
        min: 6
        max: 15
        chance: 90
    spawn-zones:
      - beach_forest_center
      - beach_forest_east

  # 5) Щелкун — крупный паук на деревьях, не нападает первым.
  forest_spider:
    display-name: "§5Щелкун"
    entity-type: SPIDER
    level: 6
    health: 70
    damage: 10
    armor: 1
    experience: 35
    drops:
      orbs:
        min: 4
        max: 10
        chance: 85
    spawn-zones:
      - beach_forest_center
      - beach_forest_east

  # ===========================================================================
  # ВЫСОКОУРОВНЕВЫЕ МОБЫ — оставлены для зон high-level (НЕ берег).
  # ===========================================================================

  # Зомби-маг (поздняя зона)
  zombie_mage:
    display-name: "§9Зомби-маг"
    entity-type: ZOMBIE
    level: 10
    health: 120
    damage: 25
    armor: 2
    experience: 80
    equipment:
      helmet: GOLDEN_HELMET
      chestplate: GOLDEN_CHESTPLATE
      mainhand: BLAZE_ROD
    drops:
      orbs:
        min: 10
        max: 30
        chance: 100
    spawn-zones:
      - dark_forest
      - ruins_zone

  # Крипер-взрывник (элитный, для босс-зон)
  elite_creeper:
    display-name: "§6§lЭлитный взрывник"
    entity-type: CREEPER
    level: 15
    health: 200
    damage: 40
    armor: 10
    experience: 150
    drops:
      orbs:
        min: 20
        max: 50
        chance: 100
    spawn-zones:
      - elite_zone
      - boss_area

# Зоны спавна мобов
spawn-zones:
  # Default world зоны (overworld) — оставляем старого зомби-воина.
  starter_zone:
    world: world
    center:
      x: 0
      y: 70
      z: 0
    radius: 100
    min-level: 1
    max-level: 5
    mobs:
      - zombie_warrior
    spawn-rate: 5

  forest_zone:
    world: world
    center:
      x: 200
      y: 70
      z: 200
    radius: 150
    min-level: 5
    max-level: 10
    mobs:
      - zombie_warrior
      - skeleton_archer
      - forest_spider
    spawn-rate: 7

  dark_forest:
    world: world
    center:
      x: -200
      y: 70
      z: -200
    radius: 120
    min-level: 8
    max-level: 15
    mobs:
      - zombie_mage
      - skeleton_archer
    spawn-rate: 10

  elite_zone:
    world: world
    center:
      x: 500
      y: 70
      z: 500
    radius: 80
    min-level: 12
    max-level: 20
    mobs:
      - elite_creeper
      - zombie_mage
    spawn-rate: 3

  # ===========================================================================
  # БЕРЕГ (стартовый мир beach) — атмосферные L2-L7 мобы по биомам.
  # ===========================================================================

  # Прибрежный лес (запад) — гниющие зомби + ползуны.
  beach_forest_west:
    world: beach
    center: {x: -50, y: 12, z: 20}
    radius: 70
    min-level: 2
    max-level: 5
    mobs: [zombie_warrior, sand_crawler]
    spawn-rate: 40
    max-mobs: 120

  # Прибрежный лес (центр) — комбо: зомби + щелкун + редко страж.
  beach_forest_center:
    world: beach
    center: {x: 0, y: 12, z: 30}
    radius: 80
    min-level: 3
    max-level: 7
    mobs: [zombie_warrior, forest_spider, skeleton_archer]
    spawn-rate: 45
    max-mobs: 150

  # Прибрежный лес (восток).
  beach_forest_east:
    world: beach
    center: {x: 50, y: 12, z: 20}
    radius: 70
    min-level: 2
    max-level: 6
    mobs: [zombie_warrior, sand_crawler, forest_spider]
    spawn-rate: 40
    max-mobs: 120

  # Берег у воды (юг) — утопленники и редкие ползуны.
  beach_coast_south:
    world: beach
    center: {x: 0, y: 8, z: -90}
    radius: 90
    min-level: 2
    max-level: 4
    mobs: [zombie_drowned, sand_crawler]
    spawn-rate: 30
    max-mobs: 80
