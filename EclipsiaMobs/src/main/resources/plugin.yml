name: EclipsiaMobs
version: '${project.version}'
main: ru.eclipsia.mobs.EclipsiaMobs
api-version: '1.20'
author: EclipsiaTeam
description: Custom Mobs and Experience System for Eclipsia Server
depend: [EclipsiaCore]

commands:
  mob:
    description: Управление кастомными мобами
    usage: /mob <spawn|list|info>
    permission: eclipsia.admin
  exp:
    description: Управление опытом
    usage: /exp <add|set|show> [игрок] [количество]
    permission: eclipsia.admin
  boss:
    description: Управление боссами
    usage: /boss <spawn|status>
    permission: eclipsia.admin

permissions:
  eclipsia.admin:
    description: Доступ к административным командам
    default: op
