# Уникальные предметы (фиксированные аффиксы)
uniques:
  warriors_blade:
    name: "Клинок Воина"
    base-type: DIAMOND_SWORD
    item-level: 15
    required-class: warrior
    required-level: 15
    lore:
      - "§7Легендарный меч древних воинов"
      - "§7Дарует силу своему владельцу"
    affixes:
      - type: damage_major
        value: 15
      - type: health_moderate
        value: 25
      - type: crit_moderate
        value: 20
  
  arcane_staff:
    name: "Посох Тайн"
    base-type: STICK
    item-level: 15
    required-class: mage
    required-level: 15
    lore:
      - "§7Древний посох магов"
      - "§7Усиливает магические способности"
    affixes:
      - type: damage_major
        value: 12
      - type: health_minor
        value: 15
      - type: speed_moderate
        value: 25
  
  hunters_bow:
    name: "Лук Охотника"
    base-type: BOW
    item-level: 15
    required-class: archer
    required-level: 15
    lore:
      - "§7Лук легендарного охотника"
      - "§7Никогда не промахивается"
    affixes:
      - type: damage_major
        value: 14
      - type: crit_moderate
        value: 30
      - type: speed_minor
        value: 15
