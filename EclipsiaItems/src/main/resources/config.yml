# Конфигурация EclipsiaItems

# Настройки генерации предметов
generation:
  # Шансы редкости на низкоуровневых мобах (mob level 1).
  # Используются как «нижний профиль» для линейной интерполяции
  # с rarity-chances-high по уровню моба.
  rarity-chances:
    normal: 70
    magic: 25
    rare: 5
    unique: 0

  # Шансы редкости на мобах уровня cap-level (см. level-scaling).
  # На промежуточных уровнях значения линейно интерполируются.
  rarity-chances-high:
    normal: 20
    magic: 35
    rare: 35
    unique: 10

  # Скейлинг шансов редкости от уровня моба.
  level-scaling:
    cap-level: 50

  # Бюджет аффиксов теперь зашит в ItemRarity (Magic 4, Rare 14).
  # Стоимость: T1=1, T2=2, T3=4, T4=7. Этот блок оставлен для
  # обратной совместимости с RarityManager.getAffixCount.
  affixes:
    magic:
      min: 1
      max: 2
    rare:
      min: 3
      max: 6

  # Диапазон уровня предмета относительно уровня моба
  item-level-range:
    min-offset: -2
    max-offset: 2

# Настройки дропа
drop:
  enabled: true
  # Шанс дропа предмета с моба (в процентах)
  drop-chance: 30
  # Бонус шанса за уровень моба (в процентах)
  level-bonus: 2
  # Максимальное количество предметов с одного моба
  max-items-per-mob: 2

# Хранение данных
storage:
  type: SQLITE  # PDC или SQLITE
  sqlite:
    database-file: eclipsia_items.db
    connection-pool-size: 10
  
  # Автосохранение инвентаря
  auto-save:
    enabled: true
    interval-minutes: 5

# Отладка
debug: false
