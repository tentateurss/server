# =============================================================================
# Eclipsia — Дерево перков (Path of Exile-style)
# Полотно 2000×2000. Три зоны (warrior/archer/mage), центр, 3 моста.
# Игрок любого класса может прокачивать узлы других классов через мосты.
# =============================================================================

settings:
  points-per-level: 1
  start-level: 2
  max-points: 200

starting-positions:
  warrior:
    node: "start_warrior"
    name: "Начало Воина"
    description: "Путь силы и мощи"
  archer:
    node: "start_archer"
    name: "Начало Лучника"
    description: "Путь ловкости и точности"
  mage:
    node: "start_mage"
    name: "Начало Мага"
    description: "Путь интеллекта и магии"

# =============================================================================
# Узлы дерева
# Типы: START, SMALL, MEDIUM, NOTABLE, KEYSTONE
# Стоимость в очках: SMALL/MEDIUM/NOTABLE/KEYSTONE = 1, START = 0 (бесплатно).
# =============================================================================
nodes:

  # ===========================================================================
  # СТАРТОВЫЕ ТОЧКИ (выдаются бесплатно при первом входе)
  # ===========================================================================
  start_warrior:
    type: START
    name: "§c§lНачало Воина"
    x: 200
    y: 600
    connections: ["w_s_1", "w_s_2", "w_s_3", "w_s_4"]
    stats:
      strength: 5

  start_archer:
    type: START
    name: "§a§lНачало Лучника"
    x: 1400
    y: 600
    connections: ["a_s_1", "a_s_2", "a_s_3", "a_s_4"]
    stats:
      dexterity: 5

  start_mage:
    type: START
    name: "§b§lНачало Мага"
    x: 800
    y: 100
    connections: ["m_s_1", "m_s_2", "m_s_3", "m_s_4"]
    stats:
