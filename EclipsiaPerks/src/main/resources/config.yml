# EclipsiaPerks Configuration

# Настройки дерева перков
settings:
  # Очков перков за уровень
  points-per-level: 1
  # Начальный уровень для получения очков
  start-level: 2
  # Максимальное количество очков
  max-points: 100

# Web API для внешнего web-фронтенда дерева перков
# Эндпоинты:
#   GET  /api/perks/tree
#   GET  /api/perks/player?uuid=...
#   POST /api/perks/allocate    {uuid, nodeId}
#   POST /api/perks/deallocate  {uuid, nodeId}
web:
  enabled: true
  port: 8080
  # Публичный хост сервера, который видят игроки в браузере.
  # Можно указать домен (example.com), IP (1.2.3.4) или полный URL (https://...).
  # Если пусто — используется server-ip из server.properties или "localhost".
  public-host: ""

# Отладка
debug: false
