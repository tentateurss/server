name: EclipsiaPerks
version: '${project.version}'
main: ru.eclipsia.perks.EclipsiaPerks
api-version: '1.20'
depend: [EclipsiaCore]
author: Eclipsia Team
description: Система перков с единым деревом

commands:
  perks:
    description: Открыть дерево перков
    usage: /perks
    aliases: [perk, skill, skills]
  perksadmin:
    description: Админские команды для перков
    usage: /perksadmin <reload|reset>
    permission: eclipsia.admin

permissions:
  eclipsia.admin:
    description: Доступ к админским командам
    default: op
  eclipsia.perks.use:
    description: Использование перков
    default: true
